<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    @keyframes logo-spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
    }

    .apple {
        width: 100px;
        height: 100px;
    animation: logo-spin infinite 50s linear;
    }
    .apple:hover {
     filter: drop-shadow(0 0 5em lightblue);
    }
    body {
        background-color: #000000;
    }
    </style>
</head>
<body>
    <img class="apple" src="../icons/applesettingicon.png" >
</body>
</html>
